<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
<title id="title">Network — Keep the story.</title>
<desc id="desc">A pale blue and pearl project banner with a constellation of softly colored circles.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#F7F9FF"/><stop offset=".55" stop-color="#EEF3FD"/><stop offset="1" stop-color="#E6F1EF"/></linearGradient>
