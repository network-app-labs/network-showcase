<text x="70" y="220" fill="#172C46" font-size="76" font-weight="500" letter-spacing="-3">Keep the story.</text>
<text x="74" y="282" fill="#4D647F" font-size="28">Remember the people you meet.</text>
<text x="74" y="325" fill="#4D647F" font-size="28">Find the connection you need.</text>
